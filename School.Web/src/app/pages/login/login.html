<div class="login-container">
    <div class="login-card">

        <h2>School Management System</h2>
        <p class="subtitle">Login to your account</p>

        <form (ngSubmit)="login()">

            <div class="form-group">
                <label for="email">Email</label>

                <input id="email" type="email" name="email" [(ngModel)]="email" placeholder="Enter your email"
                    required />
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input id="password" type="password" name="password" [(ngModel)]="password"
                    placeholder="Enter your password" required />
            </div>

            <button type="submit" [disabled]="isLoading">
                {{ isLoading ? 'Logging in...' : 'Login' }}
            </button>

        </form>

        <p class="error" *ngIf="errorMessage">
            {{ errorMessage }}
        </p>

        <p class="success" *ngIf="successMessage">
            {{ successMessage }}
        </p>

    </div>
</div>
